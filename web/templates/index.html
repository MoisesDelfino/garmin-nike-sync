{% extends "base.html" %}

{% block content %}
<div class="row align-items-center justify-content-center min-vh-75">
    <div class="col-lg-6 text-center">
        <h1 class="display-4 fw-bold mb-4">
            <i class="bi bi-arrow-left-right text-primary"></i><br>
            Garmin → Nike Sync
        </h1>
        <p class="lead text-muted mb-5">
            Sincronize automaticamente suas atividades do <strong>Garmin Connect</strong> 
            para o <strong>Nike Run Club</strong>.
        </p>
        
        <div class="d-flex gap-3 justify-content-center">
            <a href="{{ url_for('register') }}" class="btn btn-primary btn-lg">
                <i class="bi bi-person-plus"></i> Criar Conta
            </a>
            <a href="{{ url_for('login') }}" class="btn btn-outline-primary btn-lg">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
            </a>
        </div>
    </div>
</div>

<style>
.min-vh-75 {
    min-height: 75vh;
}
</style>
{% endblock %}
