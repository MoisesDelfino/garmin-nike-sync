services:
  - type: web
    name: garmin-nike-sync
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile - --log-level info
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: garmin-nike-sync-db
          property: connectionString
      - key: SYNC_INTERVAL_MINUTES
        value: 15

databases:
  - name: garmin-nike-sync-db
    databaseName: garmin_nike_sync
    user: garmin_nike_sync
    plan: free
