name: Garmin → Nike Sync

on:
  # Executa a cada 15 minutos
  schedule:
    - cron: '*/15 * * * *'
  
  # Permite executar manualmente
  workflow_dispatch:
  
  # Executa ao fazer push (para testes)
  push:
    branches: [ main, master ]

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # Necessário para commit do histórico
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔄 Run sync (Multi-User Mode)
        if: ${{ secrets.MULTI_USER_MODE == 'true' }}
        env:
          # As credenciais são carregadas dinamicamente baseadas em config/users.json
          # Configure os secrets com os nomes especificados no arquivo de configuração
          # Exemplo: GARMIN_EMAIL_USER1, GARMIN_PASSWORD_USER1, NIKE_TOKEN_USER1
          
          # User 1
          GARMIN_EMAIL_USER1: ${{ secrets.GARMIN_EMAIL_USER1 }}
          GARMIN_PASSWORD_USER1: ${{ secrets.GARMIN_PASSWORD_USER1 }}
          NIKE_TOKEN_USER1: ${{ secrets.NIKE_TOKEN_USER1 }}
          
          # User 2 (opcional)
          GARMIN_EMAIL_USER2: ${{ secrets.GARMIN_EMAIL_USER2 }}
          GARMIN_PASSWORD_USER2: ${{ secrets.GARMIN_PASSWORD_USER2 }}
          NIKE_TOKEN_USER2: ${{ secrets.NIKE_TOKEN_USER2 }}
          
          # User 3 (opcional)
          GARMIN_EMAIL_USER3: ${{ secrets.GARMIN_EMAIL_USER3 }}
          GARMIN_PASSWORD_USER3: ${{ secrets.GARMIN_PASSWORD_USER3 }}
          NIKE_TOKEN_USER3: ${{ secrets.NIKE_TOKEN_USER3 }}
          
          # Adicione mais usuários conforme necessário
        run: python main.py
      
      - name: 🔄 Run sync (Single-User Mode - Compatibilidade)
        if: ${{ secrets.MULTI_USER_MODE != 'true' }}
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          NIKE_ACCESS_TOKEN: ${{ secrets.NIKE_ACCESS_TOKEN }}
          SYNC_INTERVAL_MINUTES: 15
          HISTORICAL_SYNC_DAYS: 365
          DUPLICATE_TIME_TOLERANCE_SECONDS: 300
          DUPLICATE_DISTANCE_TOLERANCE_METERS: 50
        run: python main.py
      
      - name: 💾 Commit sync history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          
          # Adiciona arquivos de histórico (single ou multi-user)
          git add sync_history*.json config/users.json .garth/ 2>/dev/null || true
          
          # Commit apenas se houver mudanças
          if git diff --staged --quiet; then
            echo "Nenhuma mudança no histórico"
          else
            git commit -m "🔄 Update sync history - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "Histórico atualizado e commitado"
          fi
      
      - name: 📊 Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
